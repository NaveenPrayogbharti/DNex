<!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="icon" type="image/png" href="/src/assets/images/logo.png" />
      <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
      <title>DNex Consulting | Setup to Compliance</title>
      <script>
        window.addEventListener('error', function(e) {
          document.body.innerHTML = '<div style="color:red;padding:20px;font-family:monospace"><h3>Runtime Error:</h3><p>' + e.message + '</p><pre>' + (e.error ? e.error.stack : '') + '</pre></div>';
        });
        window.addEventListener('unhandledrejection', function(e) {
          document.body.innerHTML = '<div style="color:red;padding:20px;font-family:monospace"><h3>Unhandled Promise Rejection:</h3><p>' + e.reason + '</p></div>';
        });
      </script>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
